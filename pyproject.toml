[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true

[project]
name = "kings-college-galway"
version = "0.1.0"
description = "University of Galway / Ollscoil na Gaillimhe public-document processing pipeline (DLT + BAML + CocoIndex + marimo)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1 (KCG edition)" }
authors = [
    { name = "Cian Mac Liatháin", email = "[email protected]" },
]
dependencies = [
    # DLT pipeline
    "dlt[duckdb]>=1.0.0",
    # BAML extraction
    "baml-py>=0.50.0",
    # CocoIndex embedding
    "cocoindex>=1.0.0",
    # Structured logging
    "structlog>=24.0.0",
    # HTTP / scraping
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Data validation
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
notebooks = [
    # Marimo reactive notebooks (PEP 723 inline deps also work)
    "marimo>=0.10.0",
]
adk = [
    # Google ADK (used by ciandlithe SU agents that consume kcg data)
    "google-adk>=2.9.0",
]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    # Linting + type-checking
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dlt_sources", "baml_src", "cocoindex_flows"]
