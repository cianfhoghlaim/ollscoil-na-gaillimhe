# KCG OSINT allowlist — every URL a KCG DLT source scrapes MUST be
# in this file. Mirrors the `dlt_sources/cianchosaint/common/osint_allowlist.yaml`
# convention from cianchosaint but scoped to the University of Galway
# public-surface scope.

version: 1
category: kcg_osint_allowlist
